<text x="275.3" y="808.1" text-anchor="middle" font-size="12" font-style="italic" fill="#5b8c5a">dashed green line = centre (design is usually symmetrical)</text>
<text x="560" y="205" font-size="20" fill="#5a2434">2 &#183; Map / travel panel</text>
<text x="560" y="228" font-size="12.5" fill="#1d3a28">Landscape box, ~480 &#215; 320 px (3 : 2). Rounded corners.</text>
