<text x="560" y="560" font-size="20" fill="#5a2434">3 &#183; Section divider strip</text>
<text x="560" y="583" font-size="12.5" fill="#1d3a28">Optional. Thin repeating band between sections. Wide &#38; short (900 &#215; 120, 15 : 2).</text>
