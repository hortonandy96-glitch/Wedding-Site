<text x="500.0" y="149" text-anchor="middle" font-size="12.5" fill="#1d3a28">Open in Illustrator and draw a glass design inside each blank shape. Every outline is the true on&#8211;screen proportion &#8212; keep art inside the dashed guides.</text>
<text x="70" y="205" font-size="20" fill="#5a2434">1 &#183; Home&#8211;page arch window</text>
<text x="70" y="228" font-size="12.5" fill="#1d3a28">Shows at 480 &#215; 692 px (about 5 &#215; 7.2 in). Burgundy band = frame. Draw inside the white area.</text>
<g transform="translate(90,250) scale(0.545)">
<path d="M8 972 L8 340 A332 332 0 0 1 672 340 L672 972 Z" fill="#efd9de" stroke="#1d3a28" stroke-width="3"/>
