# Keeps the free Supabase project awake.
#
# Supabase pauses free projects after 7 days with zero DATABASE activity.
# This workflow runs a tiny real query (the same rsvp_search the RSVP page
# uses) DAILY, which resets that timer — so the guest list, admin login,
# and RSVP search never go to sleep.
#
# WHY DAILY (not twice a week): a ping can only KEEP a live project awake;
# it cannot WAKE a paused one (a paused project's web address stops
# resolving, so the ping just fails). Twice-weekly pings left no margin —
# two failed pings in a row (which happened in July 2026) let the 7-day
# timer expire and the project paused. Daily pings + retries give a ~7x
# safety margin so a few transient failures can't add up to a pause.
#
# If it EVER does pause anyway: it can't self-heal. Wake it from the
# Supabase dashboard (Restore), or ask Claude to restore it.
#
# The key below is the publishable anon key (already public in
# js/supabase-config.js); it can only do what the database's security
# rules allow, which for this call is a name search.

name: Keep Supabase awake

on:
  schedule:
    - cron: "37 6 * * *" # every day at 06:37 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run a real database query (with retries for transient blips)
        env:
          SUPABASE_URL: https://erkvgabptawgrlyoeimw.supabase.co
          ANON_KEY: sb_publishable_24S6pNGEVa_0dexTHQGSPA_m63SRuvD
        run: |
          response=$(curl -sf \
            --retry 6 --retry-all-errors --retry-delay 20 \
            --connect-timeout 15 --max-time 60 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/rsvp_search" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"query": "keep-alive ping"}')
          echo "Database answered: $response"
          echo "Pause timer reset."
